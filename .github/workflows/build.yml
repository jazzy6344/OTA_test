name: Build and Release ESP32 Firmware

# รันทุกครั้งที่ push tag ที่ขึ้นต้นด้วย v เช่น v1.0.3
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ต้องให้สิทธิ์ push กลับเข้า repo ได้

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ติดตั้ง Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: ติดตั้ง ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32da OTA_test --output-dir build_output

      - name: เตรียมไฟล์ firmware.bin และ version.txt
        run: |
          cp build_output/OTA_test.ino.bin firmware.bin
          # ตัดตัว v ออกจากชื่อ tag เช่น v1.0.3 -> 1.0.3
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > version.txt
          echo "Building version: $VERSION"

      - name: Commit firmware.bin และ version.txt กลับเข้า main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware.bin version.txt
          git commit -m "Auto build: update firmware to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
